# Integración continua: compila y ejecuta las pruebas en cada push y pull request a main.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    # ProductoRepositoryAdapterTest usa PostgreSQL real, así que se levanta uno para las pruebas.
    # Flyway crea la tabla al arrancar (V1__crear_tabla_productos.sql).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: topicos_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Sobrescriben la conexión de application.yml solo en CI (no se usa la contraseña local).
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/topicos_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # El permiso de ejecución se pierde si el repositorio se creó desde Windows.
      - name: Dar permiso al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B verify

      - name: Publicar el jar
        uses: actions/upload-artifact@v4
        with:
          name: producto-hex-service
          path: target/*.jar
          retention-days: 7

      - name: Publicar reportes de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: target/surefire-reports/
