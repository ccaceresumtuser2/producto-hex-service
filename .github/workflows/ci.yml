# Integración continua: compila y ejecuta las pruebas en cada push y pull request a main.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-24.04

    # No hace falta PostgreSQL: las pruebas usan H2 en memoria (src/test/resources/application-test.yml).

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # El permiso de ejecución se pierde si el repositorio se creó desde Windows.
      - name: Dar permiso al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B verify

      - name: Publicar el jar
        uses: actions/upload-artifact@v7
        with:
          name: producto-hex-service
          path: target/*.jar
          retention-days: 7

      - name: Publicar reportes de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: target/surefire-reports/

  # Solo en push a main y si las pruebas pasaron: construye la imagen Docker,
  # la sube a GitHub Container Registry (ghcr.io) y pide a Render que la despliegue.
  docker:
    name: Imagen Docker y despliegue en Render
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # necesario para subir la imagen a ghcr.io

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      # ghcr.io exige el nombre del repositorio en minúsculas.
      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Dos etiquetas: "latest" y el hash del commit (para saber exactamente qué versión corre).
      - name: Construir y subir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # RENDER_DEPLOY_HOOK_URL se crea en GitHub: Settings > Secrets and variables > Actions.
      # Render vuelve a desplegar su configuración actual (si usa la imagen :latest, descarga la recién subida).
      # Si el secreto no existe, el paso se omite con un aviso.
      - name: Desplegar en Render
        id: render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::Secreto RENDER_DEPLOY_HOOK_URL no configurado: se omite el despliegue."
            exit 0
          fi
          # Se muestra la respuesta de Render para poder diagnosticar si algo falla.
          codigo=$(curl -sS -o respuesta.txt -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Render respondió HTTP $codigo:"
          cat respuesta.txt; echo
          if [ "$codigo" -ge 300 ]; then
            echo "::error::Render rechazó el despliegue (HTTP $codigo). Revise que el secreto sea la URL del Deploy Hook del servicio web."
            exit 1
          fi
          # El hook responde {"deploy":{"id":"dep-..."}} y su URL tiene la forma .../deploy/srv-...?key=...
          # Se guardan ambos ids para que el siguiente paso consulte el estado de este despliegue.
          echo "deploy_id=$(jq -r '.deploy.id // empty' respuesta.txt)" >> "$GITHUB_OUTPUT"
          echo "service_id=$(echo "$RENDER_DEPLOY_HOOK_URL" | grep -oE 'srv-[a-z0-9]+')" >> "$GITHUB_OUTPUT"

      # El hook solo inicia el despliegue: Render lo hace después, en segundo plano.
      # Este paso espera a que termine, así el workflow queda en verde solo si la versión nueva está en línea.
      # Requiere el secreto RENDER_API_KEY (Render > Account Settings > API Keys); sin él, se omite con un aviso.
      - name: Esperar a que Render termine el despliegue
        if: steps.render.outputs.deploy_id != ''
        timeout-minutes: 15
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ steps.render.outputs.service_id }}
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::warning::Secreto RENDER_API_KEY no configurado: no se espera al despliegue. Revise Render > Events."
            exit 0
          fi
          url="https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID"
          anterior=""
          while true; do
            estado=$(curl -sS --fail-with-body -H "Authorization: Bearer $RENDER_API_KEY" \
                       -H "Accept: application/json" "$url" | jq -r '.status')
            if [ "$estado" != "$anterior" ]; then
              echo "$(date +%T) Estado del despliegue $DEPLOY_ID: $estado"
              anterior="$estado"
            fi
            case "$estado" in
              live)
                echo "Despliegue terminado: la versión nueva está en línea."
                exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::El despliegue en Render terminó con estado '$estado'. Revise Render > Logs."
                exit 1 ;;
            esac
            sleep 15
          done
