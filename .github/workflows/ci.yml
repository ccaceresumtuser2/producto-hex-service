# Integración continua: compila y ejecuta las pruebas en cada push y pull request a main.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest

    # No hace falta PostgreSQL: las pruebas usan H2 en memoria (src/test/resources/application-test.yml).

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # El permiso de ejecución se pierde si el repositorio se creó desde Windows.
      - name: Dar permiso al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B verify

      - name: Publicar el jar
        uses: actions/upload-artifact@v4
        with:
          name: producto-hex-service
          path: target/*.jar
          retention-days: 7

      - name: Publicar reportes de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: target/surefire-reports/
