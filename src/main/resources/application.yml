server:
  # Render (y otras plataformas) indican el puerto en la variable PORT; en local se usa 8090.
  port: ${PORT:8090}

spring:
  application:
    name: producto-hex-service

  # La conexión se toma de variables de entorno (en Render se configuran en el panel del servicio).
  # Los valores después de ":" son los de desarrollo local y se usan si la variable no existe.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/topicos_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:bdatos}

  jpa:
    open-in-view: false
    hibernate:
      # Hibernate crea la tabla productos (con índices y restricciones) si no existe,
      # y agrega columnas nuevas de la entidad. Nunca borra tablas ni columnas.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    # INFO: peticiones recibidas y resultado de cada caso de uso.
    # Cambiar a DEBUG para ver también las operaciones contra la BD y los detalles internos.
    "[com.ejemplo.producto]": INFO
  # Además de la consola, los logs se guardan en este archivo (ruta relativa a donde se ejecuta la app).
  file:
    name: logs/producto-hex-service.log
  # Rotación: cada día o al llegar a 10 MB se crea un archivo nuevo (comprimido .gz);
  # se guardan 30 días y como máximo 1 GB en total.
  logback:
    rollingpolicy:
      file-name-pattern: logs/producto-hex-service-%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
