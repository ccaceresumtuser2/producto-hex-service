# Perfil "test": las pruebas usan H2 en memoria en lugar de PostgreSQL.
# MODE=PostgreSQL hace que H2 imite la sintaxis de PostgreSQL, así Flyway ejecuta las mismas migraciones.
spring:
  datasource:
    url: jdbc:h2:mem:topicos_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    # La base en memoria siempre empieza vacía: no hace falta baseline.
    baseline-on-migrate: false

logging:
  file:
    name: ""
