# Perfil "test": las pruebas usan H2 en memoria en lugar de PostgreSQL.
# MODE=PostgreSQL hace que H2 acepte la misma sintaxis (p. ej. el CHECK con ~). Hibernate crea la tabla.
spring:
  datasource:
    url: jdbc:h2:mem:topicos_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

logging:
  file:
    name: ""
